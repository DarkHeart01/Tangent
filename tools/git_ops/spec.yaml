name: git_ops
description: "Git operations: branch, commit, push, open PR, and create/list/remove worktrees. Write operations (push, PR, worktree_add, worktree_remove) are mutates-external and require confirmation. Pushing to main requires prod-risk approval. Worktrees created via worktree_add are nested under .agent-worktrees/ inside the agent's own assigned worktree, not arbitrary host paths."
version: "1.1.0"
side_effect_level: mutates-external
permissions: [git_write]
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: [init, status, branch, checkout, add, commit, push, pull, log, diff, pr_create, create_tag, worktree_add, worktree_list, worktree_remove]
    branch_name:
      type: string
    commit_message:
      type: string
    files:
      type: array
      items:
        type: string
      description: "Files to stage for commit"
    remote:
      type: string
      description: "Remote name (default: origin)"
    pr_title:
      type: string
    pr_body:
      type: string
    base_branch:
      type: string
      description: "Base branch for PR (default: main)"
    working_dir:
      type: string
    tag_name:
      type: string
    message:
      type: string
      description: "Annotated tag message used by create_tag"
    commit_sha:
      type: string
      description: "Optional commit SHA to tag (defaults to HEAD)"
    worktree_name:
      type: string
      description: "Single path-segment identifier for worktree_add/worktree_list/worktree_remove — resolved to .agent-worktrees/<worktree_name> inside the agent's own worktree. No slashes or '..'."
    create_branch:
      type: boolean
      description: "worktree_add only. True (default) creates a fresh branch (branch_name, or agent-worktree/<worktree_name> if unset) for the new worktree. False attaches the worktree to an existing branch given in branch_name."
  required: [action]
  additionalProperties: false
output_schema:
  type: object
timeout: 60.0
retry_policy:
  max_attempts: 3
  backoff_seconds: [5, 15, 60]