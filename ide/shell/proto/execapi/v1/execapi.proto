// The Python-swarm-engine-calls-into-Go-daemon channel: shell_exec routing,
// filesystem read/write, and the unified human-gate primitive (phase /
// tool_call / question). Replaces the old POST /sessions/{id}/exec,
// GET|PUT /sessions/{id}/fs, POST /sessions/{id}/gate HTTP endpoints in
// ide/shell/internal/execapi.
//
// session_id and the bearer token are NOT message fields — both travel as
// gRPC metadata ("authorization: Bearer <token>", "x-session-id: <id>"),
// the same way session_id lived in the URL path (routing, not payload) and
// the token lived in the Authorization header in the HTTP design this
// replaces.
//
// GateRequest deliberately has no timeout_seconds field: the caller sets
// the RPC's own deadline (grpc's native per-call timeout) instead of
// passing a separate value the server has to trust — the Go Gate service
// reads it back via ctx.Deadline().
syntax = "proto3";

package tangent.execapi.v1;

option go_package = "shell/internal/execapigrpc/pb";

// ── Exec ─────────────────────────────────────────────────────────────────
// Mirrors tools/shell_exec/handler.py's inputs/outputs exactly (command,
// working_dir in; stdout, stderr, returncode out) so the Python side can
// pass its `inputs` through with minimal translation, same as the HTTP
// execRequest/execResponse shapes did.
service Exec {
  rpc Run(ExecRequest) returns (ExecResponse);
}

message ExecRequest {
  string command = 1;
  string working_dir = 2;
}

message ExecResponse {
  string stdout = 1;
  string stderr = 2;
  int32 returncode = 3;
}

// ── Filesystem ───────────────────────────────────────────────────────────
service Filesystem {
  rpc Read(FileReadRequest) returns (FileReadResponse);
  rpc Write(FileWriteRequest) returns (FileWriteResponse);
}

message FileReadRequest {
  string path = 1;
}

message FileReadResponse {
  bytes content = 1;
}

message FileWriteRequest {
  string path = 1;
  bytes content = 2;
}

message FileWriteResponse {
  int64 bytes_written = 1;
}

// ── Gate ─────────────────────────────────────────────────────────────────
// One generic primitive, matching the existing HTTP design (POST
// /sessions/{id}/gate with a "kind" field) rather than three separate
// RPCs — see coordination/orchestrator.py's _daemon_gate_request /
// _daemon_ws_requester and coordination/safety.py's
// _daemon_confirm_tool_call, all three of which already share one HTTP
// endpoint today.
enum GateKind {
  GATE_KIND_UNSPECIFIED = 0;
  GATE_KIND_PHASE = 1;
  GATE_KIND_TOOL_CALL = 2;
  GATE_KIND_QUESTION = 3;
}

service Gate {
  rpc Request(GateRequest) returns (GateResponse);
}

message GateRequest {
  GateKind kind = 1;

  // GATE_KIND_PHASE
  string phase_id = 2;
  string phase_name = 3;

  // GATE_KIND_TOOL_CALL
  string tool_name = 4;
  string side_effect_tier = 5;
  string args_summary = 6;

  // GATE_KIND_QUESTION
  string prompt = 7;
  repeated string options = 8;
}

// The two real distinct response shapes (approved: bool for phase/
// tool_call, decision: string — free text or a selected option — for
// question) as a oneof, rather than overloading one field ambiguously
// (e.g. stuffing "true"/"false" into the same string field a real answer
// like "us-east-1" would occupy).
message GateResponse {
  oneof result {
    bool approved = 1;
    string decision = 2;
  }
}
